volumes:
  sockets:
services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/tmp/sockets
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "10MB"

  api1:
    build: .
    environment:
      - PORT=8080
      - INSTANCE_ID=1
    volumes:
      - sockets:/tmp/sockets
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "85MB"

  api2:
    build: .
    environment:
      - PORT=8080
      - INSTANCE_ID=2
    volumes:
      - sockets:/tmp/sockets
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "85MB"

  api3:
    build: .
    environment:
      - PORT=8080
      - INSTANCE_ID=3
    volumes:
      - sockets:/tmp/sockets
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "85MB"

  api4:
    build: .
    environment:
      - PORT=8080
      - INSTANCE_ID=4
    volumes:
      - sockets:/tmp/sockets
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "85MB"
