services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
      api4:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "10MB"

  api1:
    build: .
    environment:
      - PORT=8080
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/ready" ]
      interval: 2s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "85MB"

  api2:
