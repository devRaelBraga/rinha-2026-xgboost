events {
    worker_connections 10000;
    use epoll;
    multi_accept on;
}

http {
    access_log off;

    upstream api {
        server unix:/tmp/sockets/api1.sock;
        server unix:/tmp/sockets/api2.sock;
        server unix:/tmp/sockets/api3.sock;
        server unix:/tmp/sockets/api4.sock;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
