events {
    worker_connections 4096;
}

http {
    access_log off;
    sendfile on;

    upstream api {
        least_conn;
        server api1:8080;
        server api2:8080;
        server api3:8080;
        server api4:8080;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
